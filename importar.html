<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Importar dados – Finanças da Casa</title>
<style>
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:520px;margin:40px auto;padding:0 20px;color:#1b2a22;background:#eef2ec}
button{font:inherit;border:0;border-radius:12px;padding:12px 18px;background:#2c6a4c;color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
#log{white-space:pre-wrap;background:#fff;border-radius:12px;padding:12px;margin-top:16px;min-height:60px}
</style>
</head>
<body>
<h1>Importar dados</h1>
<p>Use esta página <b>uma única vez</b>, para trazer os lançamentos que já existiam. Os lançamentos ficam registrados como feitos pela conta que importar.</p>
<p>1. Entre com Google:</p>
<div id="botaoGoogle" style="min-height:44px"></div>
<p><input type="file" id="arq" accept=".json" disabled> <br><small>2. Escolha o arquivo dados.json</small></p>
<p><button id="importar" disabled>3. Importar</button></p>
<div id="log">Aguardando…</div>
<script src="config.js"></script>
<script>
const CFG=window.FINANCAS||{},log=t=>document.getElementById("log").textContent=t;
let token=null,eu=null,dados=null;
async function api(acao,extra){
  const r=await (await fetch(CFG.API,{method:"POST",body:JSON.stringify({acao,token,...extra})})).json();
  if(r.erro) throw new Error(r.erro);
  return r;
}
async function entrar(credencial){
  token=credencial;log("Conferindo sua conta…");
  try{
    const r=await api("dados",{});eu=r.eu;
    const ja=Object.keys((r.docs&&r.docs.lancamentos)||{}).length;
    log("Conectado como "+eu.id+"."+(ja?" Atenção: já existem "+ja+" lançamentos na planilha; os do arquivo serão somados (os de mesmo código são substituídos).":"")+"\nAgora escolha o arquivo.");
    document.getElementById("arq").disabled=false;
  }catch(e){log("Erro ao entrar: "+e.message)}
}
function iniciarGoogle(){
  if(!CFG.API||!CFG.CLIENT_ID){log("Falta preencher o config.js.");return}
  google.accounts.id.initialize({client_id:CFG.CLIENT_ID,callback:r=>entrar(r.credential)});
  google.accounts.id.renderButton(document.getElementById("botaoGoogle"),{theme:"filled_blue",size:"large",shape:"pill",text:"signin_with",locale:"pt-BR"});
}
document.getElementById("arq").onchange=async e=>{
  try{dados=JSON.parse(await e.target.files[0].text());log(Object.keys(dados.lancamentos||{}).length+" lançamentos encontrados. Toque em Importar.");document.getElementById("importar").disabled=false}
  catch(err){log("Arquivo inválido: "+err.message)}
};
document.getElementById("importar").onclick=async()=>{
  const b=document.getElementById("importar");b.disabled=true;
  const ops=[
    ...Object.entries(dados.lancamentos||{}).map(([id,d])=>({op:"set",col:"lancamentos",id,data:{...d,by:eu.id}})),
    ...Object.entries(dados.config||{}).map(([id,d])=>({op:"set",col:"config",id,data:d}))
  ];
  try{
    for(let i=0;i<ops.length;i+=300){
      await api("gravar",{ops:ops.slice(i,i+300)});
      log("Importados "+Math.min(i+300,ops.length)+" de "+ops.length+"…");
    }
    log("Pronto! "+ops.length+" registros importados. Pode fechar esta página e abrir o sistema.");
  }catch(err){log("Erro: "+err.message);b.disabled=false}
};
</script>
<script src="https://accounts.google.com/gsi/client" async onload="iniciarGoogle()"></script>
</body>
</html>
